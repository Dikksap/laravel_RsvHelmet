services:
  app:
    image: ${IMAGE_NAME:-ghcr.io/dikksap/laravel_rsvhelmet:latest}
    container_name: rsv-helmet-app-prod
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8001}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      APP_NAME: "${APP_NAME:-RSV Helmet}"
      APP_ENV: "${APP_ENV:-production}"
      APP_KEY: "${APP_KEY:?APP_KEY wajib diset}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_URL: "${APP_URL:-http://192.168.1.168:8001}"
      APP_LOCALE: id
      APP_FALLBACK_LOCALE: en

      LOG_CHANNEL: stack
      LOG_STACK: single
      LOG_LEVEL: "${LOG_LEVEL:-error}"

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-rsv_helmet}"
      DB_USERNAME: "${DB_USERNAME:-laravel}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD wajib diset}"

      SESSION_DRIVER: database
      SESSION_LIFETIME: 120
      CACHE_STORE: database
      QUEUE_CONNECTION: database

      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"

      EXTERNAL_BARANG_API_URL: "${EXTERNAL_BARANG_API_URL:-http://host.docker.internal:8000}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_storage:/var/www/html/storage/app/public
      - app_logs:/var/www/html/storage/logs
    networks:
      - rsv_network

  db:
    image: mariadb:11
    container_name: rsv-helmet-db-prod
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+07:00
    environment:
      MARIADB_DATABASE: "${DB_DATABASE:-rsv_helmet}"
      MARIADB_USER: "${DB_USERNAME:-laravel}"
      MARIADB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD wajib diset}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-rootpassword}"
      TZ: Asia/Jakarta
    ports:
      - "${DB_PORT:-3308}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - rsv_network

networks:
  rsv_network:
    driver: bridge

volumes:
  db_data:
    name: rsv_helmet_db_data
  app_storage:
    name: rsv_helmet_app_storage
  app_logs:
    name: rsv_helmet_app_logs
